scenes:
  # ─────────────── 场景一：放学后的教室 ───────────────
  - id: ch01.classroom
    backgrounds: [classroom_noon, classroom_dusk, classroom_dusk_rain]
    initial: classroom_noon
    bgm: after_school
    enter: fade
    start: true
    dialog:
      d001:
        narrator:
          say: "蝉鸣忽然停了。午后的阳光斜斜地落在讲台边缘，整间教室空得能听见自己的呼吸。"
          stage: {background: classroom_noon}

      d002:
        zhou:
          sprite: laugh
          at: {x: 0.76, y: 1.0}
          animation:
            - enter: {from: right}
          say: "喂，值日早就做完了，你还没走啊？"
          voice: zhou_001

      d003:
        lin:
          sprite: neutral
          at: {x: 0.24, y: 1.0}
          animation:
            - enter: {from: left}
          say: "……你没走，我怎么走。"
          voice: lin_001

      # 继承上一行周的 sprite(laugh) 与 at(0.76, 1.0)
      d004:
        zhou:
          say: "这话说得我可太爱听了。\n我还以为你在等雨停呢。"
          voice: zhou_002

      # 场景内换景（午后 → 黄昏）+ crossfade 转场
      d005:
        narrator:
          say: "说话间，云层压低了天际，夕阳把窗框染成深琥珀色。"
          stage:
            background: classroom_dusk
            transition: crossfade

      # 场景内换景（黄昏 → 落雨）+ 切换 BGM
      d006:
        narrator:
          say: "第一滴雨敲在玻璃上，紧接着连成一片细密的声响。"
          stage:
            background: classroom_dusk_rain
            bgm: rain_light
            transition: crossfade

      d007:
        lin:
          sprite: away
          say: "……真的下雨了。"

      # 无文本节拍（R8）：隐藏对话框，停顿 0.9 秒自动推进
      d008:
        narrator:
          say: ""
          pause: 0.9

      d009:
        lin:
          sprite: neutral
          animation:
            - nod: {}
          say: "那就等雨小一点再走吧。"
          voice: lin_002

      d010:
        zhou:
          sprite: surprised
          animation:
            - jump: {}
          say: "喔！难得听你主动留下来。"

      # 角色场内移动（move）+ 停顿节拍
      d011:
        zhou:
          say: ""
          at: {x: 0.56, y: 1.0}
          animation:
            - move: {to: {x: 0.56, y: 1.0}}
          pause: 0.7

      d012:
        lin:
          sprite: away
          animation:
            - exit: {to: left, style: slow}
          say: "我去天台收一下社团的画架，马上回来。"
          voice: lin_003

  # ─────────────── 场景二：雨中的天台 ───────────────
  - id: ch01.rooftop
    backgrounds: [rooftop_night_rain, rooftop_night]
    initial: rooftop_night_rain
    bgm: rain_loop
    enter: crossfade
    dialog:
      d001:
        lin:
          sprite: away
          at: {x: 0.5, y: 1.0}
          animation:
            - enter: {from: front}
          say: "雨好像一时半会儿不会停了。"

      d002:
        narrator:
          say: "她站在天台的屋檐下没有回头，发梢带着微凉的潮气。"

      # 停止 BGM（bgm: null）
      d003:
        narrator:
          say: "远处的放学广播不知什么时候停了，四周只剩下淅淅沥沥的雨声。"
          stage: {bgm: null}

      d004:
        lin:
          sprite: neutral
          say: "……刚才在教室里，谢谢你陪我留下来。"
          voice: lin_004

      d005:
        lin:
          sprite: surprised
          animation:
            - shake: {}
          say: "！不是，你别那种表情看着我。"

      d006:
        lin:
          sprite: smile
          stage:
            background: rooftop_night
            transition: crossfade
          say: "……算了。你看，云散开一点了。"

  # ─────────────── 场景三：夜间走廊（分支选择） ───────────────
  - id: ch01.hallway
    backgrounds: [hallway_night]
    initial: hallway_night
    bgm: hallway_quiet
    enter: fade
    dialog:
      d001:
        narrator:
          say: "回到教学楼一楼时，走廊只剩尽头最后一盏灯还亮着。"

      # 新场景清空角色状态（R7），重新进场
      d002:
        zhou:
          sprite: neutral
          at: {x: 0.68, y: 1.0}
          animation:
            - enter: {from: right}
          say: "伞给你留了一把。这回真要回去了？"
          voice: zhou_003

      d003:
        lin:
          sprite: neutral
          at: {x: 0.32, y: 1.0}
          animation:
            - enter: {from: left}
          say: "嗯，再晚校门就要锁了。"

      d004:
        zhou:
          sprite: serious
          animation:
            - shake: {}
          say: "……其实我本来还有句话想问你，不过还是留到下次吧。"

      d005:
        zhou:
          sprite: laugh
          say: "那，明天见？"
          voice: zhou_004
        options:
          - id: call
            say: "「等一下——我们一起走吧。」"
            to: ch01.gate_call
          - id: quiet
            say: "「嗯，明天教室见。」（目送他离开）"
            to: ch01.gate_quiet

  # ─────────────── 结局 A：雨霁同归（展示换景 + CG 演出） ───────────────
  - id: ch01.gate_call
    backgrounds: [hallway_night, gate_night]
    initial: hallway_night
    bgm: after_school
    enter: crossfade
    dialog:
      d001:
        zhou:
          sprite: surprised
          at: {x: 0.72, y: 1.0}
          animation:
            - enter: {from: right}
            - jump: {}
          say: "……啊？"
          voice: zhou_005

      d002:
        lin:
          sprite: smile
          at: {x: 0.28, y: 1.0}
          animation:
            - enter: {from: left}
          say: "反正顺路……而且雨已经停了。"
          voice: lin_005

      d003:
        narrator:
          say: "推开校门的时候，晚风吹散了最后一层薄雾，路灯在水洼里映出暖黄的光。"
          stage:
            background: gate_night
            transition: fade

      d004:
        narrator:
          say: "雨后的暮色里，两道影子被路灯拉得很长很长。"
          stage: {cg: after_rain}

      d005:
        lin:
          sprite: smile
          say: "说好了，明天也要第一个到教室。"

      d006:
        narrator:
          say: "【True End · 雨霁同归】"
          stage: {cg: null}
    end: true

  # ─────────────── 结局 B：余音独行 ───────────────
  - id: ch01.gate_quiet
    backgrounds: [hallway_night, gate_night]
    initial: hallway_night
    bgm: null
    enter: fade
    dialog:
      d001:
        narrator:
          say: "他挥了挥手，脚步声在空旷的走廊里渐渐远去。"
          stage: {bgm: null}

      d002:
        lin:
          sprite: away
          at: {x: 0.5, y: 1.0}
          animation:
            - enter: {from: front}
          say: "……有些话，还是留到明天再说吧。"

      d003:
        narrator:
          say: "独自走出校门时，夜空已经放晴。\n【Normal End · 余音独行】"
          stage:
            background: gate_night
            transition: crossfade
    end: true
