name: carnation
description: A small visual novel player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.3
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets.yaml
    - characters.yaml
    - assets/scripts/
    - assets/backgrounds/
    - assets/characters/
    - assets/cg/
